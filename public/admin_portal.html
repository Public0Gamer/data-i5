<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClientHunter 2.0 — Seller Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-8 text-slate-800">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
    <div class="flex items-center space-x-3">
      <div class="h-10 w-10 bg-slate-900 text-white rounded-xl flex items-center justify-center font-bold text-lg">🛡️</div>
      <div>
        <h1 class="text-xl font-extrabold text-slate-900">Seller License Generator</h1>
        <p class="text-xs text-slate-500">Generate authentic license keys for Gumroad / Whop buyers</p>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Admin Secret Password</label>
        <input type="password" id="admin-pass" value="seller_admin_2026" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono text-slate-800">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Buyer Email / Name / Order ID</label>
        <input type="text" id="buyer-info" placeholder="e.g. buyer@gmail.com or Order #1234" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800">
      </div>

      <button id="btn-gen" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition">
        Generate Authentic License Key
      </button>

      <div id="gen-output" class="hidden p-4 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
        <p class="text-xs font-bold text-emerald-800 uppercase">Generated Buyer Key (Ready to give to buyer):</p>
        <div id="key-text" class="text-base font-mono font-black text-emerald-900 select-all break-all"></div>
        <p class="text-[11px] text-emerald-600">Copy and paste this key into your Gumroad delivery note or message to the buyer.</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('btn-gen').addEventListener('click', async () => {
      const adminSecret = document.getElementById('admin-pass').value.trim();
      const buyerEmail = document.getElementById('buyer-info').value.trim() || 'customer';
      try {
        const res = await fetch('/api/admin/generate-key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminSecret, buyerEmail })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('key-text').textContent = data.key;
          document.getElementById('gen-output').classList.remove('hidden');
        } else {
          alert(data.error || 'Failed to generate key.');
        }
      } catch (e) {
        alert('Network error.');
      }
    });
  </script>
</body>
</html>
